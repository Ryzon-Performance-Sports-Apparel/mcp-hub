[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ryzon-google-ads-mcp"
version = "0.1.0"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "google-ads>=29.2.0",
    "mcp[cli]>=1.2.0"
]

description = "Ryzon fork of the Google Ads MCP server, with hardened search argument handling. Based on github.com/googleads/google-ads-mcp (Apache-2.0)."
readme = "README.md"
authors = [
    { name = "Ryzon Data Team", email = "simon.heinken@ryzon.net" },
    { name = "Dean Lukies (original author)", email = "lukiesd@users.noreply.github.com" }
]
keywords = ["Google Ads", "Google Ads API", "MCP"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python"
]

[project.optional-dependencies]
dev = [
    "black",
    "nox >=2025.5.1, <2026"
]

[project.urls]
homepage = "https://github.com/Ryzon-Performance-Sports-Apparel/mcp-hub"
repository = "https://github.com/Ryzon-Performance-Sports-Apparel/mcp-hub.git"
upstream = "https://github.com/googleads/google-ads-mcp"

[project.scripts]
google-ads-mcp = "ads_mcp.server:run_server"
google-ads-mcp-update-gaql = "ads_mcp.update_references:update_gaql_resource_file"

[tool.setuptools.packages.find]
include = ["ads_mcp*"]

[tool.setuptools.package-data]
ads_mcp = ["*.json"]
